name: Validate documentation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline-structure:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify byte-exact release files
        run: python3 scripts/verify_release_manifest.py
      - name: Validate local notes and links
        run: python3 scripts/validate_vault.py
      - name: Validate Awesome README
        run: python3 scripts/check_readme_contract.py README.md
      - name: Validate imported documentation integrity
        run: python3 scripts/validate_documentation.py
      - name: Validate exact quick-reference examples
        run: python3 scripts/validate_cheatsheets.py
      - name: Test documentation transformation fixtures
        run: python3 scripts/test_documentation_pipeline.py
      - name: Audit local document fragments
        run: python3 scripts/audit_offline_anchors.py
      - name: Test plain-text manual conversion
        run: python3 scripts/test_plain_manual.py
      - name: Test non-executing roff conversion
        run: python3 scripts/test_roff_manual.py
      - name: Test complete roff tables and equations
        run: python3 scripts/test_roff_extended.py
      - name: Verify all source-bound editorial segments
        run: python3 scripts/build_arp_scan_editorial.py --check
      - name: Test non-executing native package manuals
        run: python3 scripts/test_packaged_manual.py
      - name: Reproduce complete whois editorial translation
        run: python3 scripts/build_package_editorial.py --tool whois --check
      - name: Reproduce all native package translations
        run: python3 scripts/check_package_editorials.py
